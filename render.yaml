# Render Blueprint: 이 저장소를 Docker로 배포한다 (무료 인스턴스).
# Render 대시보드 -> New -> Blueprint -> 이 저장소를 고르면 이 파일대로 자동 생성된다.
services:
  - type: web
    name: weird-ad
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY          # AI 참고 의견 (Groq). 있으면 우선 쓴다
        sync: false
      - key: GROQ_MODEL            # 선택. 기본 openai/gpt-oss-120b
        sync: false
      - key: ANTHROPIC_API_KEY     # 선택. Groq 키가 없을 때 Claude
        sync: false
      - key: FOODSAFETY_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
