# Render Blueprint: 이 저장소를 Docker로 배포한다 (무료 인스턴스).
# Render 대시보드 -> New -> Blueprint -> 이 저장소를 고르면 이 파일대로 자동 생성된다.
services:
  - type: web
    name: weird-ad
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FOODSAFETY_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
